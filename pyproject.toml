[project]
name = "2024-1-victor-hugo-renata-maria"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dill==0.4.0",
    "fqdn==1.5.1",
    "importlib-metadata==8.0.0",
    "isoduration==20.11.0",
    "jaraco-functools==4.3.0",
    "jaraco-collections==5.1.0",
    "jsonpointer==3.0.0",
    "jupyter==1.1.1",
    "openpyxl==3.1.5",
    "pip-chill==1.0.3",
    "rfc3987-syntax==1.1.0",
    "seaborn==0.13.2",
    "tinycss2==1.4.0",
    "tomli==2.0.1",
    "uqpy==4.2.1",
    "uri-template==1.3.0",
    "webcolors==25.10.0",
    "pyglam",
    "scikit-learn",
    "setuptools<81",
    "torch==2.2.2",
]

[dependency-groups]
docs = [
    "sphinx>=7.4",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]

# UQpy imports torch even for the NumPy-based PCE pipeline. Use the CPU
# build on Linux x86_64: the CUDA build crashed during import on this host.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
